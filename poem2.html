<body>

    <h1>烏衣巷</h1>
    <div class="author">唐代・劉禹錫</div>

    <!-- 3. 中央放劉禹錫畫像圖 -->
    <img class="portrait" src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Liu_Yuxi.jpg/300px-Liu_Yuxi.jpg" alt="劉禹錫畫像">

    <!-- 2. 詩的內容 -->
    <div class="content">
        朱雀橋邊野草花，<br>
        烏衣巷口夕陽斜。<br>
        舊時王謝堂前燕，<br>
        飛入尋常百姓家。
    </div>
