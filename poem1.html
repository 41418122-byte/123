    <title>詩的賞析 1 - 將進酒</title>
    <!-- 網頁內嵌式樣式設定 -->

            font-family: "微軟正黑體", sans-serif;
            padding: 20px;
        }

        h1 {
            color: blue;
            font-size: 40pt;
            margin-bottom: 10px;
        }

        .author {
            font-size: 20pt;
            color: #333;
            margin-bottom: 20px;

        /* 2. 詩內容：綠色、30點字 */
        .content {
            color: green;
            font-size: 30pt;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* 3. 畫像圖：寬300px、深紫色圖框線5px、圓角50px */

            width: 300px;
            border: 5px solid darkmagenta;

<body>

    <h1>將進酒</h1>
    <div class="author">唐代・李白</div>

    <!-- 3. 中央放李白畫像圖 -->
    <img class="portrait" src="https://upload.wikimedia.org/wikipedia/commons/9/9f/Li_Bai.jpg" alt="李白畫像">

    <!-- 2. 詩的內容 -->
    <div class="content">
        君不見，黃河之水天上去，奔流到海不復回。<br>
        君不見，高堂明鏡悲白髮，朝如青絲暮成雪。<br>
        人生得意須盡歡，莫使金樽空對月。<br>
        天生我材必有用，千金散盡還復來。<br>
        烹羊宰牛且爲樂，會須一飲三百杯。<br>
        岑夫子，丹丘生，將進酒，杯莫停。<br>
        與君歌一曲，請君爲我傾耳聽。<br>
        鐘鼓饌玉不足貴，但願長醉不復醒。<br>
        古來聖賢皆寂寞，惟有飲者留其名。<br>
        陳王昔時宴平樂，斗酒十千恣歡謔。<br>
        主人何爲言少錢，徑須沽取對君酌。<br>
        五花馬，千金裘，呼兒將出換美酒，與爾同銷萬古愁。
    </div>
